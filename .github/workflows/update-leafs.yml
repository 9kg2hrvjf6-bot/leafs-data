name: Update Leafs Data Daily

on:
  schedule:
    - cron: "0 * * * *"
   # Runs every day at 8 AM Eastern
  workflow_dispatch:       # Allows manual run

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Fetch NHL data
      run: |
        curl -s https://statsapi.web.nhl.com/api/v1/teams/10?expand=team.schedule.next >> next.json
        curl -s https://statsapi.web.nhl.com/api/v1/teams/10?expand=team.schedule.previous >> last.json

    - name: Build JSON file
      run: |
        NEXT_GAME=$(jq '.teams[0].nextGameSchedule.dates[0].games[0]' next.json)
        LAST_GAME=$(jq '.teams[0].previousGameSchedule.dates[0].games[0]' last.json)

        NEXT_HOME=$(echo $NEXT_GAME | jq -r '.teams.home.team.name')
        NEXT_AWAY=$(echo $NEXT_GAME | jq -r '.teams.away.team.name')
        NEXT_DATE=$(echo $NEXT_GAME | jq -r '.gameDate')

        LAST_HOME=$(echo $LAST_GAME | jq -r '.teams.home.team.name')
        LAST_AWAY=$(echo $LAST_GAME | jq -r '.teams.away.team.name')
        LAST_HOME_SCORE=$(echo $LAST_GAME | jq -r '.teams.home.score')
        LAST_AWAY_SCORE=$(echo $LAST_GAME | jq -r '.teams.away.score')
        LAST_DATE=$(echo $LAST_GAME | jq -r '.gameDate')

        echo "{
          \"next\": {
            \"home\": \"$NEXT_HOME\",
            \"away\": \"$NEXT_AWAY\",
            \"date\": \"$NEXT_DATE\",
            \"time\": \"TBD\"
          },
          \"last\": {
            \"home\": \"$LAST_HOME\",
            \"away\": \"$LAST_AWAY\",
            \"homeScore\": $LAST_HOME_SCORE,
            \"awayScore\": $LAST_AWAY_SCORE,
            \"date\": \"$LAST_DATE\"
          }
        }" > leafs.json

    - name: Commit updated JSON
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add leafs.json
        git commit -m "Auto-update Leafs data"
        git push
