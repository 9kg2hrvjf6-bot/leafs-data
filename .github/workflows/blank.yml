name: Update Leafs & Jays Live Data

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Fetch today's Leafs game
      run: |
        TODAY=$(TZ="America/Toronto" date +"%Y-%m-%d")
        curl -s "https://statsapi.web.nhl.com/api/v1/schedule?teamId=10&date=$TODAY" > leafs_sched.json

        GAME_PK=$(jq -r '.dates[0].games[0].gamePk' leafs_sched.json)
        curl -s "https://statsapi.web.nhl.com/api/v1/game/$GAME_PK/feed/live" > leafs_live.json

    - name: Fetch Jays live game
      run: |
        TODAY=$(TZ="America/Toronto" date +"%Y-%m-%d")
        curl -s "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=141&date=$TODAY" > jays_sched.json

        MLB_GAME_ID=$(jq -r '.dates[0].games[0].gamePk' jays_sched.json)
        curl -s "https://statsapi.mlb.com/api/v1.1/game/$MLB_GAME_ID/feed/live" > jays_live.json

    - name: Build JSON
      run: |
        L_STATUS=$(jq -r '.gameData.status.abstractGameState' leafs_live.json)
        L_HOME=$(jq -r '.gameData.teams.home.name' leafs_live.json)
        L_AWAY=$(jq -r '.gameData.teams.away.name' leafs_live.json)
        L_HOME_SCORE=$(jq -r '.liveData.linescore.teams.home.goals' leafs_live.json)
        L_AWAY_SCORE=$(jq -r '.liveData.linescore.teams.away.goals' leafs_live.json)
        L_PERIOD=$(jq -r '.liveData.linescore.currentPeriodOrdinal' leafs_live.json)
        L_TIME=$(jq -r '.liveData.linescore.currentPeriodTimeRemaining' leafs_live.json)

        J_STATUS=$(jq -r '.gameData.status.abstractGameState' jays_live.json)
        J_HOME=$(jq -r '.gameData.teams.home.name' jays_live.json)
        J_AWAY=$(jq -r '.gameData.teams.away.name' jays_live.json)
        J_HOME_SCORE=$(jq -r '.liveData.linescore.teams.home.runs' jays_live.json)
        J_AWAY_SCORE=$(jq -r '.liveData.linescore.teams.away.runs' jays_live.json)
        J_INNING=$(jq -r '.liveData.linescore.currentInningOrdinal' jays_live.json)

        echo "{
          \"leafs\": {
            \"status\": \"$L_STATUS\",
            \"home\": \"$L_HOME\",
            \"away\": \"$L_AWAY\",
            \"homeScore\": $L_HOME_SCORE,
            \"awayScore\": $L_AWAY_SCORE,
            \"period\": \"$L_PERIOD\",
            \"timeRemaining\": \"$L_TIME\"
          },
          \"jays\": {
            \"status\": \"$J_STATUS\",
            \"home\": \"$J_HOME\",
            \"away\": \"$J_AWAY\",
            \"homeScore\": $J_HOME_SCORE,
            \"awayScore\": $J_AWAY_SCORE,
            \"inning\": \"$J_INNING\"
          }
        }" > leafs.json

    - name: Commit updated JSON
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add leafs.json
        git commit -m "Auto-update Leafs & Jays live data"
        git push
