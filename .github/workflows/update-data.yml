name: DEBUG Sports + News + Weather + Traffic (Full Logging)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - name: Start Debug Session
      run: echo "🔧 DEBUG MODE ENABLED — Starting full diagnostic run..."

    # ---------------------------------------------------
    # Helper: Fallback script with logging
    # ---------------------------------------------------
    - name: Create fallback script
      run: |
        cat << 'EOF' > fallback.sh
        #!/bin/bash
        TEAM="$1"
        SPORT="$2"
        DAYS="$3"
        API="$4"
        PARSE="$5"

        echo "🔍 Fallback search for $TEAM ($SPORT) — checking last $DAYS days"

        for i in $(seq 0 "$DAYS"); do
          DATE=$(date -u -d "$i days ago" +%Y-%m-%d)
          URL="${API}${DATE}"
          echo "➡️  Checking date: $DATE"
          echo "   URL: $URL"

          RAW=$(curl -s "$URL")
          if ! echo "$RAW" | jq empty 2>/dev/null; then
            echo "   ❌ Invalid JSON for $DATE"
            continue
          fi

          OUT=$(echo "$RAW" | jq -r "$PARSE")
          if [[ -n "$OUT" ]]; then
            echo "   ✅ Found completed game: $OUT"
            echo "$OUT"
            exit 0
          else
            echo "   ⚠️ No completed game found for $DATE"
          fi
        done

        echo "❌ No completed game found in fallback window"
        echo ""
        EOF
        chmod +x fallback.sh

    # ---------------------------------------------------
    # HEADLINES (Reddit)
    # ---------------------------------------------------
    - name: Debug Headlines
      run: |
        echo "📰 DEBUG: Fetching Reddit headlines..."

        fetch() {
          topic="$1"
          url="$2"
          echo "➡️  Fetching $topic headlines from $url"
          raw=$(curl -s "$url")

          if ! echo "$raw" | jq empty 2>/dev/null; then
            echo "   ❌ Reddit returned invalid JSON for $topic"
            return
          fi

          titles=$(echo "$raw" | jq -r '.data.children[].data.title' | head -n 3)
          if [[ -z "$titles" ]]; then
            echo "   ⚠️ No headlines found for $topic (Reddit may be blocking GitHub Actions)"
          else
            echo "   ✅ Headlines for $topic:"
            echo "$titles"
          fi
        }

        fetch leafs   "https://www.reddit.com/r/leafs.json"
        fetch raptors "https://www.reddit.com/r/torontoraptors.json"
        fetch jays    "https://www.reddit.com/r/bluejays.json"
        fetch toronto "https://www.reddit.com/r/toronto.json"
        fetch canada  "https://www.reddit.com/r/canada.json"

    # ---------------------------------------------------
    # NHL Leafs — LIVE, FINAL, LAST (fallback)
    # ---------------------------------------------------
    - name: Debug Leafs
      run: |
        echo "🏒 DEBUG: Leafs NHL data"

        echo "➡️ Fetching NHL scoreboard..."
        sb=$(curl -s "https://api-web.nhle.com/v1/scoreboard/now")

        echo "➡️ Parsing LIVE..."
        live=$(echo "$sb" | jq -r '
          .games[]
          | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
          | select(.gameState=="LIVE")
          | "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score)"
        ')
        echo "   LIVE: $live"

        echo "➡️ Parsing FINAL..."
        final=$(echo "$sb" | jq -r '
          .games[]
          | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
          | select(.gameState=="FINAL")
          | "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score)"
        ')
        echo "   FINAL: $final"

        echo "➡️ Fetching NEXT game..."
        sched=$(curl -s "https://api-web.nhle.com/v1/club-schedule/TOR/now")
        next_utc=$(echo "$sched" | jq -r '.games[0].startTimeUTC')
        next_opp=$(echo "$sched" | jq -r '
          .games[0] |
          if .homeTeam.abbrev=="TOR" then .awayTeam.abbrev else .homeTeam.abbrev end
        ')
        echo "   NEXT: $next_opp at $next_utc"

        echo "➡️ Fallback search for LAST game..."
        last=$(./fallback.sh "TOR" "NHL" 3 \
          "https://api-web.nhle.com/v1/club-schedule/TOR/" \
          '.games[]
           | select(.gameState=="FINAL")
           | "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score)"'
        )
        echo "   LAST: $last"

    # ---------------------------------------------------
    # NBA Raptors — LIVE, FINAL, LAST (fallback)
    # ---------------------------------------------------
    - name: Debug Raptors
      run: |
        echo "🏀 DEBUG: Raptors NBA data"

        echo "➡️ Fetching ESPN scoreboard..."
        sb=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard")

        echo "➡️ Parsing LIVE..."
        live=$(echo "$sb" | jq -r '
          .events[]
          | select(.competitions[0].competitors[].team.abbreviation=="TOR")
          | select(.status.type.state=="in")
          | [
              .competitions[0].competitors[]
              | "\(.team.abbreviation) \(.score)"
            ] | join(" @ ")
        ')
        echo "   LIVE: $live"

        echo "➡️ Parsing FINAL..."
        final=$(echo "$sb" | jq -r '
          .events[]
          | select(.competitions[0].competitors[].team.abbreviation=="TOR")
          | select(.status.type.completed==true)
          | [
              .competitions[0].competitors[]
              | "\(.team.abbreviation) \(.score)"
            ] | join(" @ ")
        ')
        echo "   FINAL: $final"

        echo "➡️ Fetching NEXT game..."
        sched=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor")
        next_utc=$(echo "$sched" | jq -r '.team.nextEvent.date')
        next_opp=$(echo "$sched" | jq -r '
          .team.nextEvent.competitions[0].competitors[]
          | select(.team.abbreviation!="TOR")
          | .team.abbreviation
        ')
        echo "   NEXT: $next_opp at $next_utc"

        echo "➡️ Fallback search for LAST game..."
        last=$(./fallback.sh "TOR" "NBA" 3 \
          "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor/schedule?date=" \
          '.events[]
           | select(.status.type.completed==true)
           | [
               .competitions[0].competitors[]
               | "\(.team.abbreviation) \(.score)"
             ] | join(" @ ")'
        )
        echo "   LAST: $last"

    # ---------------------------------------------------
    # MLB Jays — LIVE, FINAL, LAST (fallback)
    # ---------------------------------------------------
    - name: Debug Jays
      run: |
        echo "⚾ DEBUG: Jays MLB data"

        echo "➡️ Fetching MLB live feed..."
        feed=$(curl -s "https://statsapi.mlb.com/api/v1.1/game/141/feed/live")

        echo "➡️ Parsing LIVE..."
        live=$(echo "$feed" | jq -r '
          if .gameData.status.abstractGameState=="Live" then
            "\(.liveData.linescore.away.team.abbreviation) \(.liveData.linescore.away.runs) @ \(.liveData.linescore.home.team.abbreviation) \(.liveData.linescore.home.runs)"
          else empty end
        ')
        echo "   LIVE: $live"

        echo "➡️ Parsing FINAL..."
        final=$(echo "$feed" | jq -r '
          if .gameData.status.abstractGameState=="Final" then
            "\(.liveData.linescore.away.team.abbreviation) \(.liveData.linescore.away.runs) @ \(.liveData.linescore.home.team.abbreviation) \(.liveData.linescore.home.runs)"
          else empty end
        ')
        echo "   FINAL: $final"

        echo "➡️ Fetching NEXT game..."
        sched=$(curl -s "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=141")
        next_utc=$(echo "$sched" | jq -r '.dates[0].games[0].gameDate')
        next_opp=$(echo "$sched" | jq -r '
          .dates[0].games[0].teams |
          if .home.team.id==141 then .away.team.abbreviation else .home.team.abbreviation end
        ')
        echo "   NEXT: $next_opp at $next_utc"

        echo "➡️ Fallback search for LAST game..."
        last=$(./fallback.sh "TOR" "MLB" 3 \
          "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=141&date=" \
          '.dates[].games[]
           | select(.status.abstractGameState=="Final")
           | "\(.teams.away.team.abbreviation) \(.teams.away.score) @ \(.teams.home.team.abbreviation) \(.teams.home.score)"'
        )
        echo "   LAST: $last"

    # ---------------------------------------------------
    # Traffic + Alerts
    # ---------------------------------------------------
    - name: Debug Traffic + Alerts
      run: |
        echo "🚦 DEBUG: Traffic + Weather Alerts"

        echo "➡️ Fetching traffic..."
        raw=$(curl -s "https://511on.ca/api/v2/alerts?format=json")
        echo "$raw" | jq -r '.alerts[].headline' | head -n 3

        echo "➡️ Fetching weather alerts..."
        raw=$(curl -s "https://api.weather.gc.ca/alerts?region=on")
        echo "$raw" | jq -r '.alerts[].headline' | head -n 3

    - name: End Debug Session
      run: echo "🔧 DEBUG COMPLETE — Review logs above."
