name: Update Sports + News + Weather + Traffic

permissions:
  contents: write

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Load existing JSON
      run: cp leafs.json data.json

    # ---------------------------------------------------
    # 1. Headlines (GNews)
    # ---------------------------------------------------
    - name: Fetch Headlines (GNews)
      id: news
      run: |
        fetch() {
          topic="$1"
          query="$2"
          url="https://gnews.io/api/v4/search?q=${query}&lang=en&country=ca&max=3&apikey=${GNEWS_KEY}"
          json=$(curl -s "$url")
          echo "$json" | jq empty 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "$topic=" >> $GITHUB_OUTPUT
            return
          fi
          titles=$(echo "$json" | jq -r '.articles[].title' | paste -sd " | " -)
          echo "$topic=$titles |" >> $GITHUB_OUTPUT
        }

        fetch leafs   "toronto%20maple%20leafs"
        fetch raptors "toronto%20raptors"
        fetch jays    "toronto%20blue%20jays"
        fetch toronto "toronto"
        fetch canada  "canada"

    # ---------------------------------------------------
    # 2. Leafs Standings + Next Game (NHL)
    # ---------------------------------------------------
    - name: Leafs Standings + Next Game
      id: nhl
      run: |
        raw=$(curl -s "https://api-web.nhle.com/v1/standings/now")
        echo "$raw" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "nhl_rec=" >> $GITHUB_OUTPUT
          echo "nhl_next=" >> $GITHUB_OUTPUT
          exit 0
        fi

        rec=$(echo "$raw" | jq -r '
          .standings[]?.teamRecords[]?
          | select(.teamAbbrev=="TOR")
          | "\(.teamName) \(.wins)-\(.losses)-\(.otLosses)"
        ')

        sched=$(curl -s "https://api-web.nhle.com/v1/club-schedule/TOR/now")
        echo "$sched" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "nhl_next=" >> $GITHUB_OUTPUT
        else
          next=$(echo "$sched" | jq -r '.games[0].startTimeUTC')
          echo "nhl_next=$next" >> $GITHUB_OUTPUT
        fi

        echo "nhl_rec=LEAFS STANDINGS: $rec |" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # 3. Raptors Standings + Next Game (NBA)
    # ---------------------------------------------------
    - name: Raptors Standings + Next Game
      id: nba
      run: |
        raw=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/standings")
        echo "$raw" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "nba_rec=" >> $GITHUB_OUTPUT
          echo "nba_next=" >> $GITHUB_OUTPUT
          exit 0
        fi

        rec=$(echo "$raw" | jq -r '
          .. | objects
          | select(.team?.displayName? == "Toronto Raptors")
          | "\(.team.displayName) \(.stats[0].value)-\(.stats[1].value) (\(.stats[12].value)th East)"
        ')

        sched=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor/schedule")
        echo "$sched" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "nba_next=" >> $GITHUB_OUTPUT
        else
          next=$(echo "$sched" | jq -r '.events[0].date')
          echo "nba_next=$next" >> $GITHUB_OUTPUT
        fi

        echo "nba_rec=RAPTORS STANDINGS: $rec |" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # 4. Jays Standings + Next Game (MLB)
    # ---------------------------------------------------
    - name: Jays Standings + Next Game
      id: mlb
      run: |
        raw=$(curl -s "https://statsapi.mlb.com/api/v1/standings?leagueId=103")
        echo "$raw" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "mlb_rec=" >> $GITHUB_OUTPUT
          echo "mlb_next=" >> $GITHUB_OUTPUT
          exit 0
        fi

        rec=$(echo "$raw" | jq -r '
          .records[].teamRecords[]
          | select(.team.name=="Toronto Blue Jays")
          | "\(.team.name) \(.wins)-\(.losses)"
        ')

        sched=$(curl -s "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=141")
        echo "$sched" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "mlb_next=" >> $GITHUB_OUTPUT
        else
          next=$(echo "$sched" | jq -r '.dates[0].games[0].gameDate')
          echo "mlb_next=$next" >> $GITHUB_OUTPUT
        fi

        echo "mlb_rec=BLUE JAYS STANDINGS: $rec |" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # 5. Toronto Traffic Alerts
    # ---------------------------------------------------
    - name: Fetch Toronto Traffic Alerts
      id: traffic
      run: |
        raw=$(curl -s "https://511on.ca/api/v2/alerts?format=json")
        echo "$raw" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "traffic=" >> $GITHUB_OUTPUT
          exit 0
        fi

        titles=$(echo "$raw" | jq -r '.alerts[].headline' | head -n 3 | paste -sd " | " -)
        echo "traffic=TRAFFIC: $titles |" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # 6. Weather Alerts (Environment Canada)
    # ---------------------------------------------------
    - name: Fetch Weather Alerts
      id: wx
      run: |
        raw=$(curl -s "https://api.weather.gc.ca/alerts?region=on")
        echo "$raw" | jq empty 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "wx=" >> $GITHUB_OUTPUT
          exit 0
        fi

        titles=$(echo "$raw" | jq -r '.alerts[].headline' | head -n 3 | paste -sd " | " -)
        echo "wx=ALERTS: $titles |" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # 7. Merge into JSON
    # ---------------------------------------------------
    - name: Merge into JSON
      run: |
        jq \
          --arg leafs   "${{ steps.news.outputs.leafs }}" \
          --arg raps    "${{ steps.news.outputs.raptors }}" \
          --arg jays    "${{ steps.news.outputs.jays }}" \
          --arg toronto "${{ steps.news.outputs.toronto }}" \
          --arg canada  "${{ steps.news.outputs.canada }}" \
          --arg nhlrec  "${{ steps.nhl.outputs.nhl_rec }}" \
          --arg nhlnext "${{ steps.nhl.outputs.nhl_next }}" \
          --arg nbarec  "${{ steps.nba.outputs.nba_rec }}" \
          --arg nbanext "${{ steps.nba.outputs.nba_next }}" \
          --arg mlbrec  "${{ steps.mlb.outputs.mlb_rec }}" \
          --arg mlbnext "${{ steps.mlb.outputs.mlb_next }}" \
          --arg traffic "${{ steps.traffic.outputs.traffic }}" \
          --arg wx      "${{ steps.wx.outputs.wx }}" \
        '
        .leafs_headlines   = $leafs   |
        .raptors_headlines = $raps    |
        .jays_headlines    = $jays    |

        .leafs_standings   = $nhlrec  |
        .raptors_standings = $nbarec  |
        .jays_standings    = $mlbrec  |

        .leafs_next_utc    = $nhlnext |
        .raptors_next_utc  = $nbanext |
        .jays_next_utc     = $mlbnext |

        .toronto_headlines = $toronto |
        .canada_headlines  = $canada  |
        .toronto_traffic   = $traffic |
        .weather_alerts    = $wx
        ' data.json > leafs.json

    # ---------------------------------------------------
    # 8. Commit updated JSON
    # ---------------------------------------------------
    - name: Commit updated JSON
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update sports/news/weather/traffic"
        file_pattern: leafs.json
