name: Update Sports + News + Weather + Traffic (Safe Merge)

permissions:
  contents: write

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Load existing JSON
      run: cp leafs.json old.json

    # ---------------------------------------------------
    # Fetch Reddit Headlines (may fail → safe merge)
    # ---------------------------------------------------
    - name: Fetch Headlines
      id: news
      run: |
        fetch() {
          topic="$1"
          url="$2"
          raw=$(curl -s "$url")
          echo "$raw" | jq empty 2>/dev/null || {
            echo "$topic=" >> $GITHUB_OUTPUT
            return
          }
          titles=$(echo "$raw" | jq -r '.data.children[].data.title' | head -n 3 | paste -sd " | " -)
          echo "$topic=$titles" >> $GITHUB_OUTPUT
        }

        fetch leafs   "https://www.reddit.com/r/leafs.json"
        fetch raptors "https://www.reddit.com/r/torontoraptors.json"
        fetch jays    "https://www.reddit.com/r/bluejays.json"
        fetch toronto "https://www.reddit.com/r/toronto.json"
        fetch canada  "https://www.reddit.com/r/canada.json"

    # ---------------------------------------------------
    # NHL Leafs
    # ---------------------------------------------------
    - name: Leafs Data
      id: nhl
      run: |
        sched=$(curl -s "https://api-web.nhle.com/v1/club-schedule/TOR/now")
        echo "$sched" | jq empty 2>/dev/null || {
          echo "leafs_next_utc=" >> $GITHUB_OUTPUT
          echo "leafs_next_opponent=" >> $GITHUB_OUTPUT
          echo "nhl_live=" >> $GITHUB_OUTPUT
          echo "nhl_final=" >> $GITHUB_OUTPUT
          exit 0
        }

        leafs_next_utc=$(echo "$sched" | jq -r '.games[0].startTimeUTC')
        leafs_next_opponent=$(echo "$sched" | jq -r '
          .games[0] |
          if .homeTeam.abbrev=="TOR" then .awayTeam.abbrev else .homeTeam.abbrev end
        ')

        live=$(curl -s "https://api-web.nhle.com/v1/scoreboard/now" | jq -r '
          .games[]
          | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
          | if .gameState=="LIVE" then
              "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score) \(.periodDescriptor.number)P \(.timeRemaining)"
            else empty end
        ')

        final=$(curl -s "https://api-web.nhle.com/v1/scoreboard/now" | jq -r '
          .games[]
          | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
          | if .gameState=="FINAL" then
              "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score)"
            else empty end
        ')

        echo "leafs_next_utc=$leafs_next_utc" >> $GITHUB_OUTPUT
        echo "leafs_next_opponent=$leafs_next_opponent" >> $GITHUB_OUTPUT
        echo "nhl_live=$live" >> $GITHUB_OUTPUT
        echo "nhl_final=$final" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # NBA Raptors (ESPN)
    # ---------------------------------------------------
    - name: Raptors Data
      id: nba
      run: |
        sched=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor/schedule")
        echo "$sched" | jq empty 2>/dev/null || {
          echo "raptors_next_utc=" >> $GITHUB_OUTPUT
          echo "raptors_next_opponent=" >> $GITHUB_OUTPUT
          echo "nba_live=" >> $GITHUB_OUTPUT
          echo "nba_final=" >> $GITHUB_OUTPUT
          exit 0
        }

        raptors_next_utc=$(echo "$sched" | jq -r '.events[0].date')
        raptors_next_opponent=$(echo "$sched" | jq -r '
          .events[0].competitions[0].competitors[]
          | select(.team.abbreviation!="TOR")
          | .team.abbreviation
        ')

        live=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" | jq -r '
          .events[]
          | select(.competitions[0].competitors[].team.abbreviation=="TOR")
          | if .status.type.state=="in" then
              [
                .competitions[0].competitors[]
                | "\(.team.abbreviation) \(.score)"
              ] | join(" @ ")
            else empty end
        ')

        final=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" | jq -r '
          .events[]
          | select(.competitions[0].competitors[].team.abbreviation=="TOR")
          | if .status.type.completed==true then
              [
                .competitions[0].competitors[]
                | "\(.team.abbreviation) \(.score)"
              ] | join(" @ ")
            else empty end
        ')

        echo "raptors_next_utc=$raptors_next_utc" >> $GITHUB_OUTPUT
        echo "raptors_next_opponent=$raptors_next_opponent" >> $GITHUB_OUTPUT
        echo "nba_live=$live" >> $GITHUB_OUTPUT
        echo "nba_final=$final" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # MLB Jays
    # ---------------------------------------------------
    - name: Jays Data
      id: mlb
      run: |
        sched=$(curl -s "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=141")
        echo "$sched" | jq empty 2>/dev/null || {
          echo "jays_next_utc=" >> $GITHUB_OUTPUT
          echo "jays_next_opponent=" >> $GITHUB_OUTPUT
          echo "mlb_live=" >> $GITHUB_OUTPUT
          echo "mlb_final=" >> $GITHUB_OUTPUT
          exit 0
        }

        jays_next_utc=$(echo "$sched" | jq -r '.dates[0].games[0].gameDate')
        jays_next_opponent=$(echo "$sched" | jq -r '
          .dates[0].games[0].teams |
          if .home.team.id==141 then .away.team.abbreviation else .home.team.abbreviation end
        ')

        live=$(curl -s "https://statsapi.mlb.com/api/v1.1/game/141/feed/live" | jq -r '
          if .gameData.status.abstractGameState=="Live" then
            "\(.liveData.linescore.teams.away.team.abbreviation) \(.liveData.linescore.teams.away.runs) @ \(.liveData.linescore.teams.home.team.abbreviation) \(.liveData.linescore.teams.home.runs)"
          else empty end
        ')

        final=$(curl -s "https://statsapi.mlb.com/api/v1.1/game/141/feed/live" | jq -r '
          if .gameData.status.abstractGameState=="Final" then
            "\(.liveData.linescore.teams.away.team.abbreviation) \(.liveData.linescore.teams.away.runs) @ \(.liveData.linescore.teams.home.team.abbreviation) \(.liveData.linescore.teams.home.runs)"
          else empty end
        ')

        echo "jays_next_utc=$jays_next_utc" >> $GITHUB_OUTPUT
        echo "jays_next_opponent=$jays_next_opponent" >> $GITHUB_OUTPUT
        echo "mlb_live=$live" >> $GITHUB_OUTPUT
        echo "mlb_final=$final" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # Traffic + Weather Alerts
    # ---------------------------------------------------
    - name: Traffic
      id: traffic
      run: |
        raw=$(curl -s "https://511on.ca/api/v2/alerts?format=json")
        titles=$(echo "$raw" | jq -r '.alerts[].headline' | head -n 3 | paste -sd " | " -)
        echo "toronto_traffic=$titles" >> $GITHUB_OUTPUT

    - name: Weather Alerts
      id: wx
      run: |
        raw=$(curl -s "https://api.weather.gc.ca/alerts?region=on")
        titles=$(echo "$raw" | jq -r '.alerts[].headline' | head -n 3 | paste -sd " | " -)
        echo "weather_alerts=$titles" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # Standings
    # ---------------------------------------------------
    - name: Leafs Standings
      id: leafs_stand
      run: |
        stand=$(curl -s "https://api-web.nhle.com/v1/standings/now")
        rec=$(echo "$stand" | jq -r '.standings[] | select(.teamAbbrev=="TOR") | "\(.wins)-\(.losses)-\(.otLosses)"')
        div=$(echo "$stand" | jq -r '.standings[] | select(.teamAbbrev=="TOR") | .divisionRank')
        echo "leafs_standings=${rec} (${div} Atlantic)" >> $GITHUB_OUTPUT

    - name: Jays Standings
      id: jays_stand
      run: |
        stand=$(curl -s "https://statsapi.mlb.com/api/v1/standings?leagueId=103")
        rec=$(echo "$stand" | jq -r '.records[].teamRecords[] | select(.team.id==141) | "\(.wins)-\(.losses)"')
        div=$(echo "$stand" | jq -r '.records[].teamRecords[] | select(.team.id==141) | .divisionRank')
        echo "jays_standings=${rec} (${div} AL East)" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # SAFE MERGE JSON
    # ---------------------------------------------------
    - name: Merge JSON Safely
      run: |
        jq \
          --argjson old "$(cat old.json)" \
          --arg leafs_next_utc "${{ steps.nhl.outputs.leafs_next_utc }}" \
          --arg leafs_next_opponent "${{ steps.nhl.outputs.leafs_next_opponent }}" \
          --arg nhl_live "${{ steps.nhl.outputs.nhl_live }}" \
          --arg nhl_final "${{ steps.nhl.outputs.nhl_final }}" \
          --arg raptors_next_utc "${{ steps.nba.outputs.raptors_next_utc }}" \
          --arg raptors_next_opponent "${{ steps.nba.outputs.raptors_next_opponent }}" \
          --arg nba_live "${{ steps.nba.outputs.nba_live }}" \
          --arg nba_final "${{ steps.nba.outputs.nba_final }}" \
          --arg jays_next_utc "${{ steps.mlb.outputs.jays_next_utc }}" \
          --arg jays_next_opponent "${{ steps.mlb.outputs.jays_next_opponent }}" \
          --arg mlb_live "${{ steps.mlb.outputs.mlb_live }}" \
          --arg mlb_final "${{ steps.mlb.outputs.mlb_final }}" \
          --arg leafs_standings "${{ steps.leafs_stand.outputs.leafs_standings }}" \
          --arg jays_standings "${{ steps.jays_stand.outputs.jays_standings }}" \
          --arg leafs_headlines "${{ steps.news.outputs.leafs }}" \
          --arg raptors_headlines "${{ steps.news.outputs.raptors }}" \
          --arg jays_headlines "${{ steps.news.outputs.jays }}" \
          --arg toronto_headlines "${{ steps.news.outputs.toronto }}" \
          --arg canada_headlines "${{ steps.news.outputs.canada }}" \
          --arg toronto_traffic "${{ steps.traffic.outputs.toronto_traffic }}" \
          --arg weather_alerts "${{ steps.wx.outputs.weather_alerts }}" \
        '
        .leafs_next_utc      = ($leafs_next_utc      | select(length>0) // $old.leafs_next_utc) |
        .leafs_next_opponent = ($leafs_next_opponent | select(length>0) // $old.leafs_next_opponent) |
        .nhl_live            = ($nhl_live            | select(length>0) // $old.nhl_live) |
        .nhl_final           = ($nhl_final           | select(length>0) // $old.nhl_final) |

        .raptors_next_utc      = ($raptors_next_utc      | select(length>0) // $old.raptors_next_utc) |
        .raptors_next_opponent = ($raptors_next_opponent | select(length>0) // $old.raptors_next_opponent) |
        .nba_live              = ($nba_live              | select(length>0) // $old.nba_live) |
        .nba_final             = ($nba_final             | select(length>0) // $old.nba_final) |

        .jays_next_utc      = ($jays_next_utc      | select(length>0) // $old.jays_next_utc) |
        .jays_next_opponent = ($jays_next_opponent | select(length>0) // $old.jays_next_opponent) |
        .mlb_live           = ($mlb_live           | select(length>0) // $old.mlb_live) |
        .mlb_final          = ($mlb_final          | select(length>0) // $old.mlb_final) |

        .leafs_standings = ($leafs_standings | select(length>0) // $old.leafs_standings) |
        .jays_standings  = ($jays_standings  | select(length>0) // $old.jays_standings) |

        .leafs_headlines   = ($leafs_headlines   | select(length>0) // $old.leafs_headlines) |
        .raptors_headlines = ($raptors_headlines | select(length>0) // $old.raptors_headlines) |
        .jays_headlines    = ($jays_headlines    | select(length>0) // $old.jays_headlines) |

        .toronto_headlines = ($toronto_headlines | select(length>0) // $old.toronto_headlines) |
        .canada_headlines  = ($canada_headlines  | select(length>0) // $old.canada_headlines) |
        .toronto_traffic   = ($toronto_traffic   | select(length>0) // $old.toronto_traffic) |
        .weather_alerts    = ($weather_alerts    | select(length>0) // $old.weather_alerts)
        ' old.json > leafs.json

    - name: Commit updated JSON
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Safe update sports/news/weather/traffic"
        file_pattern: leafs.json
