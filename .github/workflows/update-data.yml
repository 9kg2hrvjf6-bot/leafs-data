name: Update Sports + News + Weather + Traffic

permissions:
  contents: write

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Load existing JSON
      run: cp leafs.json data.json

    # ---------------------------------------------------
    # FREE NEWS (Reddit JSON feeds)
    # ---------------------------------------------------
    - name: Fetch Headlines (Reddit)
      id: news
      run: |
        fetch() {
          topic="$1"
          url="$2"

          raw=$(curl -s "$url")
          echo "$raw" | jq empty 2>/dev/null || {
            echo "$topic=" >> $GITHUB_OUTPUT
            return
          }

          titles=$(echo "$raw" | jq -r '.data.children[].data.title' | head -n 3 | paste -sd " | " -)
          echo "$topic=$titles |" >> $GITHUB_OUTPUT
        }

        fetch leafs   "https://www.reddit.com/r/leafs.json"
        fetch raptors "https://www.reddit.com/r/torontoraptors.json"
        fetch jays    "https://www.reddit.com/r/bluejays.json"
        fetch toronto "https://www.reddit.com/r/toronto.json"
        fetch canada  "https://www.reddit.com/r/canada.json"

    # ---------------------------------------------------
    # NHL Leafs — Next Game + Opponent + LIVE + FINAL
    # ---------------------------------------------------
    - name: Leafs Data (NHL)
      id: nhl
      run: |
        sched=$(curl -s "https://api-web.nhle.com/v1/club-schedule-season/TOR/2024")
        leafs_next_utc=$(echo "$sched" | jq -r '.games[0].startTimeUTC')
        leafs_next_opponent=$(echo "$sched" | jq -r '.games[0] |
          if .homeTeam.abbrev=="TOR" then .awayTeam.abbrev else .homeTeam.abbrev end')

        live=$(curl -s "https://api-web.nhle.com/v1/scoreboard/now" \
          | jq -r '.games[] | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
            | if .gameState=="LIVE" then
                "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score) \(.periodDescriptor.number)P \(.timeRemaining)"
              else empty end')

        final=$(curl -s "https://api-web.nhle.com/v1/scoreboard/now" \
          | jq -r '.games[] | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
            | if .gameState=="FINAL" then
                "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score)"
              else empty end')

        echo "leafs_next_utc=$leafs_next_utc" >> $GITHUB_OUTPUT
        echo "leafs_next_opponent=$leafs_next_opponent" >> $GITHUB_OUTPUT
        echo "nhl_live=$live" >> $GITHUB_OUTPUT
        echo "nhl_final=$final" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # NBA Raptors — Next Game + Opponent + LIVE + FINAL
    # ---------------------------------------------------
    - name: Raptors Data (NBA / ESPN)
      id: nba
      run: |
        sched=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor/schedule")
        raptors_next_utc=$(echo "$sched" | jq -r '.events[0].date')
        raptors_next_opponent=$(echo "$sched" | jq -r '.events[0].competitions[0].competitors[]
          | select(.team.abbreviation!="TOR") | .team.abbreviation')

        live=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" \
          | jq -r '.events[] | select(.competitions[0].competitors[].team.abbreviation=="TOR")
            | if .status.type.state=="in" then
                .competitions[0].competitors[] |
                "\(.team.abbreviation) \(.score)" | paste -sd " @ " -
              else empty end')

        final=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" \
          | jq -r '.events[] | select(.competitions[0].competitors[].team.abbreviation=="TOR")
            | if .status.type.completed==true then
                .competitions[0].competitors[] |
                "\(.team.abbreviation) \(.score)" | paste -sd " @ " -
              else empty end')

        echo "raptors_next_utc=$raptors_next_utc" >> $GITHUB_OUTPUT
        echo "raptors_next_opponent=$raptors_next_opponent" >> $GITHUB_OUTPUT
        echo "nba_live=$live" >> $GITHUB_OUTPUT
        echo "nba_final=$final" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # MLB Jays — Next Game + Opponent + LIVE + FINAL
    # ---------------------------------------------------
    - name: Jays Data (MLB)
      id: mlb
      run: |
        sched=$(curl -s "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=141")
        jays_next_utc=$(echo "$sched" | jq -r '.dates[0].games[0].gameDate')
        jays_next_opponent=$(echo "$sched" | jq -r '.dates[0].games[0].teams |
          if .home.team.id==141 then .away.team.abbreviation else .home.team.abbreviation end')

        live=$(curl -s "https://statsapi.mlb.com/api/v1.1/game/141/feed/live" \
          | jq -r 'if .gameData.status.abstractGameState=="Live" then
              "\(.liveData.linescore.teams.away.team.abbreviation) \(.liveData.linescore.teams.away.runs) @ \(.liveData.linescore.teams.home.team.abbreviation) \(.liveData.linescore.teams.home.runs)"
            else empty end')

        final=$(curl -s "https://statsapi.mlb.com/api/v1.1/game/141/feed/live" \
          | jq -r 'if .gameData.status.abstractGameState=="Final" then
              "\(.liveData.linescore.teams.away.team.abbreviation) \(.liveData.linescore.teams.away.runs) @ \(.liveData.linescore.teams.home.team.abbreviation) \(.liveData.linescore.teams.home.runs)"
            else empty end')

        echo "jays_next_utc=$jays_next_utc" >> $GITHUB_OUTPUT
        echo "jays_next_opponent=$jays_next_opponent" >> $GITHUB_OUTPUT
        echo "mlb_live=$live" >> $GITHUB_OUTPUT
        echo "mlb_final=$final" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # Toronto Traffic (511 Ontario)
    # ---------------------------------------------------
    - name: Toronto Traffic
      id: traffic
      run: |
        raw=$(curl -s "https://511on.ca/api/v2/alerts?format=json")
        titles=$(echo "$raw" | jq -r '.alerts[].headline' | head -n 3 | paste -sd " | " -)
        echo "traffic=$titles |" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # Weather Alerts (Environment Canada)
    # ---------------------------------------------------
    - name: Weather Alerts
      id: wx
      run: |
        raw=$(curl -s "https://api.weather.gc.ca/alerts?region=on")
        titles=$(echo "$raw" | jq -r '.alerts[].headline' | head -n 3 | paste -sd " | " -)
        echo "wx=$titles |" >> $GITHUB_OUTPUT

    # ---------------------------------------------------
    # Merge JSON
    # ---------------------------------------------------
    - name: Merge JSON
      run: |
        jq \
          --arg leafs   "${{ steps.news.outputs.leafs }}" \
          --arg raps    "${{ steps.news.outputs.raptors }}" \
          --arg jays    "${{ steps.news.outputs.jays }}" \
          --arg toronto "${{ steps.news.outputs.toronto }}" \
          --arg canada  "${{ steps.news.outputs.canada }}" \
          --arg leafs_next_utc "${{ steps.nhl.outputs.leafs_next_utc }}" \
          --arg leafs_next_opponent "${{ steps.nhl.outputs.leafs_next_opponent }}" \
          --arg nhl_live "${{ steps.nhl.outputs.nhl_live }}" \
          --arg nhl_final "${{ steps.nhl.outputs.nhl_final }}" \
          --arg raps_next_utc "${{ steps.nba.outputs.raptors_next_utc }}" \
          --arg raps_next_opponent "${{ steps.nba.outputs.raptors_next_opponent }}" \
          --arg nba_live "${{ steps.nba.outputs.nba_live }}" \
          --arg nba_final "${{ steps.nba.outputs.nba_final }}" \
          --arg jays_next_utc "${{ steps.mlb.outputs.jays_next_utc }}" \
          --arg jays_next_opponent "${{ steps.mlb.outputs.jays_next_opponent }}" \
          --arg mlb_live "${{ steps.mlb.outputs.mlb_live }}" \
          --arg mlb_final "${{ steps.mlb.outputs.mlb_final }}" \
          --arg traffic "${{ steps.traffic.outputs.traffic }}" \
          --arg wx "${{ steps.wx.outputs.wx }}" \
        '
        .leafs_headlines   = $leafs   |
        .raptors_headlines = $raps    |
        .jays_headlines    = $jays    |

        .leafs_next_utc    = $leafs_next_utc |
        .leafs_next_opponent = $leafs_next_opponent |
        .nhl_live          = $nhl_live |
        .nhl_final         = $nhl_final |

        .raptors_next_utc  = $raps_next_utc |
        .raptors_next_opponent = $raps_next_opponent |
        .nba_live          = $nba_live |
        .nba_final         = $nba_final |

        .jays_next_utc     = $jays_next_utc |
        .jays_next_opponent = $jays_next_opponent |
        .mlb_live          = $mlb_live |
        .mlb_final         = $mlb_final |

        .toronto_headlines = $toronto |
        .canada_headlines  = $canada  |
        .toronto_traffic   = $traffic |
        .weather_alerts    = $wx
        ' data.json > leafs.json

    # ---------------------------------------------------
    # Commit JSON
    # ---------------------------------------------------
    - name: Commit updated JSON
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update sports/news/weather/traffic"
        file_pattern: leafs.json
       
