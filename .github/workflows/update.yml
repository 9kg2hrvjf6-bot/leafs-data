name: Update Leafs/Raptors/Jays Data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Fetch NHL Leafs Data
      run: |
        nhl_json=$(curl -s "https://api-web.nhle.com/v1/club-schedule-season/TOR/2024")
        leafs_next_utc=$(echo "$nhl_json" | jq -r '.games[0].startTimeUTC')
        leafs_next_opponent=$(echo "$nhl_json" | jq -r '.games[0] |
          if .homeTeam.abbrev=="TOR" then .awayTeam.abbrev else .homeTeam.abbrev end')

        nhl_live=$(curl -s "https://api-web.nhle.com/v1/scoreboard/now" \
          | jq -r '.games[] | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
            | if .gameState=="LIVE" then "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score) \(.periodDescriptor.number)P \(.timeRemaining)" else empty end')

        nhl_final=$(curl -s "https://api-web.nhle.com/v1/scoreboard/now" \
          | jq -r '.games[] | select(.homeTeam.abbrev=="TOR" or .awayTeam.abbrev=="TOR")
            | if .gameState=="FINAL" then "\(.awayTeam.abbrev) \(.awayTeam.score) @ \(.homeTeam.abbrev) \(.homeTeam.score)" else empty end')

        leafs_headlines=$(curl -s "https://newsapi.org/v2/everything?q=Toronto%20Maple%20Leafs&apiKey=$NEWSAPI" \
          | jq -r '.articles[].title' | cut -c1-60 | paste -sd " | " -)

        echo "leafs_next_utc=$leafs_next_utc" >> $GITHUB_ENV
        echo "leafs_next_opponent=$leafs_next_opponent" >> $GITHUB_ENV
        echo "nhl_live=$nhl_live" >> $GITHUB_ENV
        echo "nhl_final=$nhl_final" >> $GITHUB_ENV
        echo "leafs_headlines=$leafs_headlines" >> $GITHUB_ENV

    - name: Fetch NBA Raptors Data
      run: |
        nba_json=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor/schedule")
        raptors_next_utc=$(echo "$nba_json" | jq -r '.events[0].date')
        raptors_next_opponent=$(echo "$nba_json" | jq -r '.events[0].competitions[0].competitors[]
          | select(.team.abbreviation!="TOR") | .team.abbreviation')

        nba_live=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" \
          | jq -r '.events[] | select(.competitions[0].competitors[].team.abbreviation=="TOR")
            | if .status.type.state=="in" then .competitions[0].competitors[] |
              "\(.team.abbreviation) \(.score)" | paste -sd " @ " - else empty end')

        nba_final=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" \
          | jq -r '.events[] | select(.competitions[0].competitors[].team.abbreviation=="TOR")
            | if .status.type.completed==true then .competitions[0].competitors[] |
              "\(.team.abbreviation) \(.score)" | paste -sd " @ " - else empty end')

        raptors_headlines=$(curl -s "https://newsapi.org/v2/everything?q=Toronto%20Raptors&apiKey=$NEWSAPI" \
          | jq -r '.articles[].title' | cut -c1-60 | paste -sd " | " -)

        echo "raptors_next_utc=$raptors_next_utc" >> $GITHUB_ENV
        echo "raptors_next_opponent=$raptors_next_opponent" >> $GITHUB_ENV
        echo "nba_live=$nba_live" >> $GITHUB_ENV
        echo "nba_final=$nba_final" >> $GITHUB_ENV
        echo "raptors_headlines=$raptors_headlines" >> $GITHUB_ENV

    - name: Fetch MLB Jays Data
      run: |
        mlb_json=$(curl -s "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=141")
        jays_next_utc=$(echo "$mlb_json" | jq -r '.dates[0].games[0].gameDate')
        jays_next_opponent=$(echo "$mlb_json" | jq -r '.dates[0].games[0].teams |
          if .home.team.id==141 then .away.team.abbreviation else .home.team.abbreviation end')

        mlb_live=$(curl -s "https://statsapi.mlb.com/api/v1.1/game/141/feed/live" \
          | jq -r 'if .gameData.status.abstractGameState=="Live" then
              "\(.liveData.linescore.teams.away.team.abbreviation) \(.liveData.linescore.teams.away.runs) @ \(.liveData.linescore.teams.home.team.abbreviation) \(.liveData.linescore.teams.home.runs)"
            else empty end')

        mlb_final=$(curl -s "https://statsapi.mlb.com/api/v1.1/game/141/feed/live" \
          | jq -r 'if .gameData.status.abstractGameState=="Final" then
              "\(.liveData.linescore.teams.away.team.abbreviation) \(.liveData.linescore.teams.away.runs) @ \(.liveData.linescore.teams.home.team.abbreviation) \(.liveData.linescore.teams.home.runs)"
            else empty end')

        jays_headlines=$(curl -s "https://newsapi.org/v2/everything?q=Toronto%20Blue%20Jays&apiKey=$NEWSAPI" \
          | jq -r '.articles[].title' | cut -c1-60 | paste -sd " | " -)

        echo "jays_next_utc=$jays_next_utc" >> $GITHUB_ENV
        echo "jays_next_opponent=$jays_next_opponent" >> $GITHUB_ENV
        echo "mlb_live=$mlb_live" >> $GITHUB_ENV
        echo "mlb_final=$mlb_final" >> $GITHUB_ENV
        echo "jays_headlines=$jays_headlines" >> $GITHUB_ENV

    - name: Toronto News + Canada News + Traffic + Weather Alerts
      run: |
        toronto_headlines=$(curl -s "https://newsapi.org/v2/everything?q=Toronto&apiKey=$NEWSAPI" \
          | jq -r '.articles[].title' | cut -c1-60 | paste -sd " | " -)

        canada_headlines=$(curl -s "https://newsapi.org/v2/top-headlines?country=ca&apiKey=$NEWSAPI" \
          | jq -r '.articles[].title' | cut -c1-60 | paste -sd " | " -)

        weather_alerts=$(curl -s "https://api.weather.gc.ca/alerts?region=on" \
          | jq -r '.alerts[].headline' | cut -c1-60 | paste -sd " | " -)

        toronto_traffic=$(curl -s "https://511on.ca/api/v2/alerts?format=json" \
          | jq -r '.alerts[].headline' | cut -c1-60 | paste -sd " | " -)

        echo "toronto_headlines=$toronto_headlines" >> $GITHUB_ENV
        echo "canada_headlines=$canada_headlines" >> $GITHUB_ENV
        echo "weather_alerts=$weather_alerts" >> $GITHUB_ENV
        echo "toronto_traffic=$toronto_traffic" >> $GITHUB_ENV

    - name: Build JSON
      run: |
        cat <<EOF > leafs.json
{
  "leafs_next_utc": "$leafs_next_utc",
  "leafs_next_opponent": "$leafs_next_opponent",
  "nhl_live": "$nhl_live",
  "nhl_final": "$nhl_final",
  "leafs_headlines": "$leafs_headlines",

  "raptors_next_utc": "$raptors_next_utc",
  "raptors_next_opponent": "$raptors_next_opponent",
  "nba_live": "$nba_live",
  "nba_final": "$nba_final",
  "raptors_headlines": "$raptors_headlines",

  "jays_next_utc": "$jays_next_utc",
  "jays_next_opponent": "$jays_next_opponent",
  "mlb_live": "$mlb_live",
  "mlb_final": "$mlb_final",
  "jays_headlines": "$jays_headlines",

  "toronto_headlines": "$toronto_headlines",
  "canada_headlines": "$canada_headlines",
  "weather_alerts": "$weather_alerts",
  "toronto_traffic": "$toronto_traffic"
}
EOF

    - name: Commit JSON
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add leafs.json
        git commit -m "Update data"
        git push

